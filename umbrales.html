<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Invernadero | Configurar Umbrales</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap">
<style>
:root {
  --verde: #157215; --lima: #cee98e;
  --bg-grad: radial-gradient(circle at 12% 10%, #ffffff 0%, #eefbd6 38%, #d2f0a8 75%, #bce6b4 100%);
  --card: rgba(255, 255, 255, 0.58); --card-borde: rgba(255, 255, 255, 0.88);
  --card-sombra: 0 12px 32px -4px rgba(21, 114, 21, 0.12), inset 0 1px 1px rgba(255, 255, 255, 0.9);
  --texto: #10260c; --suave: #3d5434; --input-bg: rgba(255, 255, 255, 0.68);
  --orbe-1: rgba(154, 235, 110, 0.55); --orbe-2: rgba(114, 224, 210, 0.42); --orbe-3: rgba(255, 251, 145, 0.65);
  box-sizing: border-box;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg-grad: radial-gradient(circle at 15% 10%, #1a3316 0%, #0e1d0d 55%, #071108 100%);
    --card: rgba(22, 42, 18, 0.58); --card-borde: rgba(180, 235, 150, 0.22);
    --card-sombra: 0 14px 36px rgba(0, 0, 0, 0.45), inset 0 1px 1px rgba(255, 255, 255, 0.14);
    --texto: #f3f8dc; --suave: #b4c59a; --input-bg: rgba(10, 22, 9, 0.58);
    --orbe-1: rgba(45, 165, 55, 0.28); --orbe-2: rgba(32, 168, 175, 0.22); --orbe-3: rgba(195, 215, 55, 0.18);
    color-scheme: dark;
  }
}
*, *::before, *::after { box-sizing: inherit; }
body {
  margin: 0; min-height: 100vh; background: var(--bg-grad); background-attachment: fixed;
  color: var(--texto); font-family: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  line-height: 1.45; overflow-x: hidden; position: relative;
}
.aero-bg { position: fixed; inset: 0; z-index: -1; pointer-events: none; overflow: hidden; }
.orbe { position: absolute; border-radius: 50%; filter: blur(60px); animation: flotar 14s ease-in-out infinite alternate; }
.orbe-1 { width: 420px; height: 420px; background: var(--orbe-1); top: -80px; left: -60px; }
.orbe-2 { width: 360px; height: 360px; background: var(--orbe-2); top: 38%; right: -70px; animation-delay: -5s; }
.orbe-3 { width: 460px; height: 460px; background: var(--orbe-3); bottom: -120px; left: 22%; animation-delay: -9s; }
@keyframes flotar { 0% { transform: translate(0, 0) scale(1); } 100% { transform: translate(25px, 30px) scale(1.08); } }

.wrap { max-width: 920px; margin: 0 auto; padding: 28px 20px 48px; }
header { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 22px; }
h1 { margin: 0; font-size: clamp(1.55rem, 3.6vw, 2.2rem); font-weight: 800; letter-spacing: -0.02em; }
.sub { margin: 4px 0 0; color: var(--suave); font-size: 0.92rem; }

.btn-volver, .btn-primario, .btn-preset {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  padding: 10px 16px; border-radius: 16px; font-family: inherit; font-weight: 700;
  font-size: 0.9rem; text-decoration: none; cursor: pointer; transition: transform 0.2s ease;
}
.btn-volver { background: var(--card); color: var(--texto); border: 1px solid var(--card-borde); box-shadow: var(--card-sombra); }
.btn-primario { background: linear-gradient(180deg, #43d654 0%, var(--verde) 100%); color: #fff; border: 0; box-shadow: 0 8px 18px -4px rgba(21, 114, 21, 0.38); }
.btn-preset { padding: 7px 12px; font-size: 0.82rem; border-radius: 12px; background: rgba(255,255,255,0.5); color: var(--texto); border: 1px solid var(--card-borde); }

.card {
  position: relative; overflow: hidden; background: var(--card);
  backdrop-filter: blur(18px) saturate(145%); -webkit-backdrop-filter: blur(18px) saturate(145%);
  border: 1px solid var(--card-borde); box-shadow: var(--card-sombra); border-radius: 24px; padding: 24px;
}
.card::before {
  content: ""; position: absolute; inset: 0 0 auto 0; height: 45%;
  background: linear-gradient(180deg, rgba(255, 255, 255, 0.35) 0%, rgba(255, 255, 255, 0) 100%); pointer-events: none;
}
.presets { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 18px; }
.bloques { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
@media (max-width: 760px) { .bloques { grid-template-columns: 1fr; } }

.grupo { padding: 16px; border-radius: 18px; background: rgba(255,255,255,0.38); border: 1px solid var(--card-borde); }
.grupo h2 { margin: 0 0 12px; font-size: 0.98rem; font-weight: 800; }
.fila { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.campo { display: flex; flex-direction: column; gap: 5px; }
label { font-size: 0.82rem; font-weight: 600; color: var(--suave); }
input {
  width: 100%; padding: 9px 11px; border-radius: 12px; border: 1px solid rgba(21,114,21,0.24);
  background: var(--input-bg); color: var(--texto); font-family: inherit; font-size: 0.95rem; font-weight: 700;
}
.pie-form { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; margin-top: 20px; }
.msg { font-size: 0.88rem; font-weight: 700; color: var(--verde); }
.msg.error { color: #b91c1c; }
</style>
</head>
<body>
<div class="aero-bg" aria-hidden="true">
  <div class="orbe orbe-1"></div><div class="orbe orbe-2"></div><div class="orbe orbe-3"></div>
</div>

<div class="wrap">
  <header>
    <div>
      <h1>CONFIGURAR UMBRALES</h1>
      <p class="sub" id="sub-cultivo">Rangos ideales de operación para tu invernadero.</p>
    </div>
    <a href="pagina principal.html" class="btn-volver">← Volver al monitoreo</a>
  </header>

  <section class="card">
    <div class="presets">
      <span class="sub" style="margin:0;">Rangos rápidos:</span>
      <button type="button" class="btn-preset" data-preset="jitomate">Jitomate (40–60% / 20–28°C)</button>
      <button type="button" class="btn-preset" data-preset="lechuga">Lechuga (50–70% / 15–22°C)</button>
      <button type="button" class="btn-preset" data-preset="fresa">Fresa (45–65% / 18–25°C)</button>
    </div>

    <form id="form-umbrales">
      <div class="bloques">
        <div class="grupo">
          <h2>Humedad del suelo (%)</h2>
          <div class="fila">
            <div class="campo"><label for="suelo-min">Mínimo</label><input id="suelo-min" type="number" min="0" max="100" required></div>
            <div class="campo"><label for="suelo-max">Máximo</label><input id="suelo-max" type="number" min="0" max="100" required></div>
          </div>
        </div>

        <div class="grupo">
          <h2>Temperatura amb. (°C)</h2>
          <div class="fila">
            <div class="campo"><label for="temp-min">Mínimo</label><input id="temp-min" type="number" min="0" max="60" step="0.5" required></div>
            <div class="campo"><label for="temp-max">Máximo</label><input id="temp-max" type="number" min="0" max="60" step="0.5" required></div>
          </div>
        </div>

        <div class="grupo">
          <h2>Humedad amb. (%)</h2>
          <div class="fila">
            <div class="campo"><label for="hum-min">Mínimo</label><input id="hum-min" type="number" min="0" max="100" required></div>
            <div class="campo"><label for="hum-max">Máximo</label><input id="hum-max" type="number" min="0" max="100" required></div>
          </div>
        </div>
      </div>

      <div class="pie-form">
        <div id="msg-umbrales" class="msg"></div>
        <button type="submit" class="btn-primario">Guardar umbrales</button>
      </div>
    </form>
  </section>
</div>

<script>
const STORAGE_KEY = "invernadero_sistema_v1";
const PRESETS = {
  jitomate: { sueloMin: 40, sueloMax: 60, tempMin: 20, tempMax: 28, humMin: 60, humMax: 80 },
  lechuga:  { sueloMin: 50, sueloMax: 70, tempMin: 15, tempMax: 22, humMin: 65, humMax: 85 },
  fresa:    { sueloMin: 45, sueloMax: 65, tempMin: 18, tempMax: 25, humMin: 60, humMax: 75 }
};

function leerEstado() {
  return JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}") || {};
}

function rellenarCampos(u) {
  document.getElementById("suelo-min").value = u.sueloMin ?? 40;
  document.getElementById("suelo-max").value = u.sueloMax ?? 60;
  document.getElementById("temp-min").value  = u.tempMin  ?? 20;
  document.getElementById("temp-max").value  = u.tempMax  ?? 28;
  document.getElementById("hum-min").value   = u.humMin   ?? 60;
  document.getElementById("hum-max").value   = u.humMax   ?? 80;
}

const stInicial = leerEstado();
const activo = (stInicial.cultivos || []).find(c => c.id === stInicial.cultivoActivoId);
if (activo) {
  document.getElementById("sub-cultivo").textContent = `Cultivo activo: ${activo.nombre} (${activo.etapa})`;
}
rellenarCampos(stInicial.umbrales || PRESETS.jitomate);

document.querySelectorAll("[data-preset]").forEach(btn => {
  btn.addEventListener("click", () => {
    rellenarCampos(PRESETS[btn.dataset.preset]);
    document.getElementById("msg-umbrales").textContent = "Preset cargado. Pulsa 'Guardar umbrales' para aplicar.";
  });
});

document.getElementById("form-umbrales").addEventListener("submit", (e) => {
  e.preventDefault();
  const msg = document.getElementById("msg-umbrales");
  const u = {
    sueloMin: Number(document.getElementById("suelo-min").value),
    sueloMax: Number(document.getElementById("suelo-max").value),
    tempMin:  Number(document.getElementById("temp-min").value),
    tempMax:  Number(document.getElementById("temp-max").value),
    humMin:   Number(document.getElementById("hum-min").value),
    humMax:   Number(document.getElementById("hum-max").value)
  };

  if (u.sueloMin >= u.sueloMax || u.tempMin >= u.tempMax || u.humMin >= u.humMax) {
    msg.textContent = "Cada valor mínimo debe ser menor que su máximo.";
    msg.className = "msg error";
    return;
  }

  const st = leerEstado();
  st.umbrales = u;
  localStorage.setItem(STORAGE_KEY, JSON.stringify(st));
  msg.textContent = "Umbrales guardados correctamente.";
  msg.className = "msg";
});
</script>
</body>
</html>
