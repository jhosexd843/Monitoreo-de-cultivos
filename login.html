<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Invernadero | Acceso</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap">
<style>
:root {
  --verde: #157215;
  --verde-brillo: #38c149;
  --lima: #cee98e;
  --amarillo: #dfdb35;

  --bg-grad: radial-gradient(circle at 12% 10%, #ffffff 0%, #eefbd6 38%, #d2f0a8 75%, #bce6b4 100%);
  --card: rgba(255, 255, 255, 0.58);
  --card-borde: rgba(255, 255, 255, 0.88);
  --card-sombra: 0 14px 36px -4px rgba(21, 114, 21, 0.14), inset 0 1px 1px rgba(255, 255, 255, 0.92);
  --texto: #10260c;
  --suave: #3d5434;
  --input-bg: rgba(255, 255, 255, 0.65);
  --input-borde: rgba(21, 114, 21, 0.22);
  --orbe-1: rgba(154, 235, 110, 0.55);
  --orbe-2: rgba(114, 224, 210, 0.42);
  --orbe-3: rgba(255, 251, 145, 0.65);
  box-sizing: border-box;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg-grad: radial-gradient(circle at 15% 10%, #1a3316 0%, #0e1d0d 55%, #071108 100%);
    --card: rgba(22, 42, 18, 0.6);
    --card-borde: rgba(180, 235, 150, 0.22);
    --card-sombra: 0 16px 40px rgba(0, 0, 0, 0.5), inset 0 1px 1px rgba(255, 255, 255, 0.14);
    --texto: #f3f8dc;
    --suave: #b4c59a;
    --input-bg: rgba(10, 22, 9, 0.55);
    --input-borde: rgba(180, 235, 150, 0.25);
    --orbe-1: rgba(45, 165, 55, 0.28);
    --orbe-2: rgba(32, 168, 175, 0.22);
    --orbe-3: rgba(195, 215, 55, 0.18);
    color-scheme: dark;
  }
}

*, *::before, *::after { box-sizing: inherit; }

body {
  margin: 0;
  min-height: 100vh;
  display: grid;
  place-items: center;
  padding: 24px 16px;
  background: var(--bg-grad);
  background-attachment: fixed;
  color: var(--texto);
  font-family: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  line-height: 1.45;
  overflow-x: hidden;
  position: relative;
}

.aero-bg {
  position: fixed;
  inset: 0;
  z-index: -1;
  pointer-events: none;
  overflow: hidden;
}
.orbe {
  position: absolute;
  border-radius: 50%;
  filter: blur(60px);
  animation: flotar 14s ease-in-out infinite alternate;
}
.orbe-1 { width: 420px; height: 420px; background: var(--orbe-1); top: -80px; left: -60px; }
.orbe-2 { width: 360px; height: 360px; background: var(--orbe-2); top: 38%; right: -70px; animation-delay: -5s; }
.orbe-3 { width: 460px; height: 460px; background: var(--orbe-3); bottom: -120px; left: 22%; animation-delay: -9s; }

@keyframes flotar {
  0% { transform: translate(0, 0) scale(1); }
  100% { transform: translate(25px, 30px) scale(1.08); }
}

.auth-box {
  width: 100%;
  max-width: 440px;
  position: relative;
  overflow: hidden;
  background: var(--card);
  backdrop-filter: blur(18px) saturate(145%);
  -webkit-backdrop-filter: blur(18px) saturate(145%);
  border: 1px solid var(--card-borde);
  box-shadow: var(--card-sombra);
  border-radius: 26px;
  padding: 28px 26px;
}

.auth-box::before {
  content: "";
  position: absolute;
  inset: 0 0 auto 0;
  height: 42%;
  background: linear-gradient(180deg, rgba(255, 255, 255, 0.38) 0%, rgba(255, 255, 255, 0) 100%);
  pointer-events: none;
}

.marca-top {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-size: 0.85rem;
  font-weight: 600;
  color: var(--suave);
  margin-bottom: 10px;
}
.punto {
  width: 9px;
  height: 9px;
  border-radius: 50%;
  background: radial-gradient(circle at 30% 30%, #7ef58a, var(--verde));
}

h1 {
  margin: 0;
  font-size: 1.85rem;
  font-weight: 800;
  letter-spacing: -0.02em;
  line-height: 1.1;
}
.sub {
  margin: 6px 0 20px;
  color: var(--suave);
  font-size: 0.92rem;
}

.tabs {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 6px;
  padding: 5px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.38);
  border: 1px solid var(--card-borde);
  margin-bottom: 20px;
}
.tab-btn {
  border: 0;
  background: transparent;
  color: var(--suave);
  font-family: inherit;
  font-size: 0.9rem;
  font-weight: 600;
  padding: 9px 12px;
  border-radius: 999px;
  cursor: pointer;
  transition: all 0.25s ease;
}
.tab-btn.activa {
  background: linear-gradient(180deg, #43d654 0%, var(--verde) 100%);
  color: #ffffff;
  box-shadow: 0 4px 12px rgba(21, 114, 21, 0.28);
}

form { display: none; flex-direction: column; gap: 14px; }
form.activo { display: flex; }

.campo { display: flex; flex-direction: column; gap: 5px; }
label { font-size: 0.86rem; font-weight: 600; color: var(--texto); }

input {
  width: 100%;
  padding: 11px 14px;
  border-radius: 14px;
  border: 1px solid var(--input-borde);
  background: var(--input-bg);
  color: var(--texto);
  font-family: inherit;
  font-size: 0.95rem;
  outline: none;
  transition: border-color 0.2s ease, box-shadow 0.2s ease;
}
input:focus {
  border-color: var(--verde);
  box-shadow: 0 0 0 3px rgba(56, 193, 73, 0.22);
}

.btn-principal {
  margin-top: 6px;
  width: 100%;
  padding: 12px 16px;
  border: 0;
  border-radius: 16px;
  background: linear-gradient(180deg, #43d654 0%, var(--verde) 100%);
  color: #ffffff;
  font-family: inherit;
  font-size: 0.98rem;
  font-weight: 800;
  cursor: pointer;
  box-shadow: 0 8px 20px -4px rgba(21, 114, 21, 0.4), inset 0 1px 1px rgba(255, 255, 255, 0.65);
  transition: transform 0.2s ease, filter 0.2s ease;
}
.btn-principal:hover { transform: translateY(-1px); filter: brightness(1.04); }
.btn-principal:active { transform: translateY(0); }

.btn-demo {
  margin-top: 10px;
  width: 100%;
  padding: 9px 14px;
  border-radius: 14px;
  border: 1px solid var(--card-borde);
  background: rgba(255, 255, 255, 0.42);
  color: var(--texto);
  font-family: inherit;
  font-size: 0.85rem;
  font-weight: 600;
  cursor: pointer;
}
.btn-demo:hover { background: rgba(255, 255, 255, 0.65); }

.mensaje {
  margin-top: 14px;
  padding: 10px 12px;
  border-radius: 12px;
  font-size: 0.86rem;
  font-weight: 600;
  display: none;
}
.mensaje.error {
  display: block;
  background: rgba(220, 38, 38, 0.14);
  border: 1px solid rgba(220, 38, 38, 0.35);
  color: #991b1b;
}
.mensaje.ok {
  display: block;
  background: rgba(21, 114, 21, 0.14);
  border: 1px solid rgba(21, 114, 21, 0.35);
  color: var(--verde);
}
@media (prefers-color-scheme: dark) {
  .mensaje.error { color: #fca5a5; }
  .mensaje.ok { color: #86efac; }
}
</style>
</head>
<body>

<div class="aero-bg" aria-hidden="true">
  <div class="orbe orbe-1"></div>
  <div class="orbe orbe-2"></div>
  <div class="orbe orbe-3"></div>
</div>

<main class="auth-box">
  <div class="marca-top"><span class="punto" aria-hidden="true"></span>INVERNADERO ESP32</div>
  <h1 id="titulo-auth">Bienvenido</h1>
  <p class="sub" id="sub-auth">Inicia sesión para consultar y administrar tus cultivos.</p>

  <div class="tabs" role="tablist">
    <button type="button" class="tab-btn activa" id="tab-login" role="tab" aria-selected="true">Iniciar sesión</button>
    <button type="button" class="tab-btn" id="tab-registro" role="tab" aria-selected="false">Registrarse</button>
  </div>

  <!-- Formulario Login -->
  <form id="form-login" class="activo" autocomplete="on">
    <div class="campo">
      <label for="login-usuario">Usuario o correo</label>
      <input id="login-usuario" type="text" required placeholder="ej. agricultor1">
    </div>
    <div class="campo">
      <label for="login-pass">Contraseña</label>
      <input id="login-pass" type="password" required placeholder="••••••••">
    </div>
    <button type="submit" class="btn-principal">Entrar al sistema</button>
  </form>

  <!-- Formulario Registro -->
  <form id="form-registro" autocomplete="off">
    <div class="campo">
      <label for="reg-nombre">Nombre completo</label>
      <input id="reg-nombre" type="text" required placeholder="ej. Carlos Mendoza">
    </div>
    <div class="campo">
      <label for="reg-usuario">Nombre de usuario</label>
      <input id="reg-usuario" type="text" required placeholder="ej. cmendoza">
    </div>
    <div class="campo">
      <label for="reg-pass">Contraseña (mín. 6 caracteres)</label>
      <input id="reg-pass" type="password" minlength="6" required placeholder="••••••••">
    </div>
    <div class="campo">
      <label for="reg-pass2">Confirmar contraseña</label>
      <input id="reg-pass2" type="password" minlength="6" required placeholder="••••••••">
    </div>
    <button type="submit" class="btn-principal">Crear cuenta</button>
  </form>

  <button type="button" class="btn-demo" id="btn-demo">Acceso rápido (usuario demo: admin / 123456)</button>

  <div id="mensaje" class="mensaje" role="alert"></div>
</main>

<script>
const CLAVE_USUARIOS = "invernadero_usuarios_v1";
const CLAVE_SESION = "invernadero_sesion_v1";

function obtenerUsuarios() {
  const guardados = JSON.parse(localStorage.getItem(CLAVE_USUARIOS) || "[]");
  if (!guardados.some(u => u.usuario === "admin")) {
    guardados.push({
      nombre: "Agricultor Demo",
      usuario: "admin",
      pass: "123456"
    });
    localStorage.setItem(CLAVE_USUARIOS, JSON.stringify(guardados));
  }
  return guardados;
}

function mostrarMensaje(texto, tipo = "error") {
  const el = document.getElementById("mensaje");
  el.textContent = texto;
  el.className = `mensaje ${tipo}`;
}

function entrarAlSistema(usuarioObj) {
  localStorage.setItem(CLAVE_SESION, JSON.stringify({
    nombre: usuarioObj.nombre,
    usuario: usuarioObj.usuario,
    hora: new Date().toISOString()
  }));
  mostrarMensaje(`¡Hola, ${usuarioObj.nombre}! Abriendo monitoreo...`, "ok");
  setTimeout(() => {
    window.location.href = "pagina principal.html";
  }, 600);
}

// Alternar pestañas Login / Registro
const tabLogin = document.getElementById("tab-login");
const tabRegistro = document.getElementById("tab-registro");
const formLogin = document.getElementById("form-login");
const formRegistro = document.getElementById("form-registro");
const tituloAuth = document.getElementById("titulo-auth");
const subAuth = document.getElementById("sub-auth");
const mensajeEl = document.getElementById("mensaje");

function cambiarModo(modo) {
  mensajeEl.className = "mensaje";
  mensajeEl.textContent = "";
  const esLogin = modo === "login";

  tabLogin.classList.toggle("activa", esLogin);
  tabRegistro.classList.toggle("activa", !esLogin);
  tabLogin.setAttribute("aria-selected", esLogin);
  tabRegistro.setAttribute("aria-selected", !esLogin);

  formLogin.classList.toggle("activo", esLogin);
  formRegistro.classList.toggle("activo", !esLogin);

  tituloAuth.textContent = esLogin ? "Bienvenido" : "Crear cuenta";
  subAuth.textContent = esLogin
    ? "Inicia sesión para consultar y administrar tus cultivos."
    : "Registra un usuario para acceder al panel del invernadero.";
}

tabLogin.addEventListener("click", () => cambiarModo("login"));
tabRegistro.addEventListener("click", () => cambiarModo("registro"));

// Login
formLogin.addEventListener("submit", (e) => {
  e.preventDefault();
  const userInput = document.getElementById("login-usuario").value.trim().toLowerCase();
  const passInput = document.getElementById("login-pass").value;

  const usuarios = obtenerUsuarios();
  const encontrado = usuarios.find(
    u => (u.usuario.toLowerCase() === userInput || u.nombre.toLowerCase() === userInput) && u.pass === passInput
  );

  if (!encontrado) {
    mostrarMensaje("Usuario o contraseña incorrectos.", "error");
    return;
  }
  entrarAlSistema(encontrado);
});

// Registro
formRegistro.addEventListener("submit", (e) => {
  e.preventDefault();
  const nombre = document.getElementById("reg-nombre").value.trim();
  const usuario = document.getElementById("reg-usuario").value.trim();
  const pass = document.getElementById("reg-pass").value;
  const pass2 = document.getElementById("reg-pass2").value;

  if (pass !== pass2) {
    mostrarMensaje("Las contraseñas no coinciden.", "error");
    return;
  }

  const usuarios = obtenerUsuarios();
  if (usuarios.some(u => u.usuario.toLowerCase() === usuario.toLowerCase())) {
    mostrarMensaje("Ese nombre de usuario ya existe. Elige otro.", "error");
    return;
  }

  const nuevoUsuario = { nombre, usuario, pass };
  usuarios.push(nuevoUsuario);
  localStorage.setItem(CLAVE_USUARIOS, JSON.stringify(usuarios));
  entrarAlSistema(nuevoUsuario);
});

// Botón demo
document.getElementById("btn-demo").addEventListener("click", () => {
  const demo = obtenerUsuarios().find(u => u.usuario === "admin");
  entrarAlSistema(demo);
});

obtenerUsuarios();
</script>
</body>
</html>
