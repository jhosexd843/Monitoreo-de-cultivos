<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Invernadero | Conexión ESP32 y API</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap">
<style>
:root {
  --verde: #157215; --lima: #cee98e;
  --bg-grad: radial-gradient(circle at 12% 10%, #ffffff 0%, #eefbd6 38%, #d2f0a8 75%, #bce6b4 100%);
  --card: rgba(255, 255, 255, 0.58); --card-borde: rgba(255, 255, 255, 0.88);
  --card-sombra: 0 12px 32px -4px rgba(21, 114, 21, 0.12), inset 0 1px 1px rgba(255, 255, 255, 0.9);
  --texto: #10260c; --suave: #3d5434; --input-bg: rgba(255, 255, 255, 0.68);
  --orbe-1: rgba(154, 235, 110, 0.55); --orbe-2: rgba(114, 224, 210, 0.42); --orbe-3: rgba(255, 251, 145, 0.65);
  box-sizing: border-box;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg-grad: radial-gradient(circle at 15% 10%, #1a3316 0%, #0e1d0d 55%, #071108 100%);
    --card: rgba(22, 42, 18, 0.58); --card-borde: rgba(180, 235, 150, 0.22);
    --card-sombra: 0 14px 36px rgba(0, 0, 0, 0.45), inset 0 1px 1px rgba(255, 255, 255, 0.14);
    --texto: #f3f8dc; --suave: #b4c59a; --input-bg: rgba(10, 22, 9, 0.58);
    --orbe-1: rgba(45, 165, 55, 0.28); --orbe-2: rgba(32, 168, 175, 0.22); --orbe-3: rgba(195, 215, 55, 0.18);
    color-scheme: dark;
  }
}
*, *::before, *::after { box-sizing: inherit; }
body {
  margin: 0; min-height: 100vh; background: var(--bg-grad); background-attachment: fixed;
  color: var(--texto); font-family: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  line-height: 1.45; overflow-x: hidden; position: relative;
}
.aero-bg { position: fixed; inset: 0; z-index: -1; pointer-events: none; overflow: hidden; }
.orbe { position: absolute; border-radius: 50%; filter: blur(60px); animation: flotar 14s ease-in-out infinite alternate; }
.orbe-1 { width: 420px; height: 420px; background: var(--orbe-1); top: -80px; left: -60px; }
.orbe-2 { width: 360px; height: 360px; background: var(--orbe-2); top: 38%; right: -70px; animation-delay: -5s; }
.orbe-3 { width: 460px; height: 460px; background: var(--orbe-3); bottom: -120px; left: 22%; animation-delay: -9s; }
@keyframes flotar { 0% { transform: translate(0, 0) scale(1); } 100% { transform: translate(25px, 30px) scale(1.08); } }

.wrap { max-width: 920px; margin: 0 auto; padding: 28px 20px 48px; }
header { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 22px; }
h1 { margin: 0; font-size: clamp(1.55rem, 3.6vw, 2.2rem); font-weight: 800; letter-spacing: -0.02em; }
.sub { margin: 4px 0 0; color: var(--suave); font-size: 0.92rem; }

.btn-volver, .btn-primario, .btn-sec {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  padding: 10px 16px; border-radius: 16px; font-family: inherit; font-weight: 700;
  font-size: 0.9rem; text-decoration: none; cursor: pointer; transition: transform 0.2s ease;
}
.btn-volver, .btn-sec { background: var(--card); color: var(--texto); border: 1px solid var(--card-borde); box-shadow: var(--card-sombra); }
.btn-primario { background: linear-gradient(180deg, #43d654 0%, var(--verde) 100%); color: #fff; border: 0; box-shadow: 0 8px 18px -4px rgba(21, 114, 21, 0.38); }

.card {
  position: relative; overflow: hidden; background: var(--card);
  backdrop-filter: blur(18px) saturate(145%); -webkit-backdrop-filter: blur(18px) saturate(145%);
  border: 1px solid var(--card-borde); box-shadow: var(--card-sombra); border-radius: 24px; padding: 24px;
}
.card::before {
  content: ""; position: absolute; inset: 0 0 auto 0; height: 45%;
  background: linear-gradient(180deg, rgba(255, 255, 255, 0.35) 0%, rgba(255, 255, 255, 0) 100%); pointer-events: none;
}
form { display: flex; flex-direction: column; gap: 14px; }
.fila { display: grid; grid-template-columns: 2fr 1fr; gap: 14px; }
@media (max-width: 700px) { .fila { grid-template-columns: 1fr; } }
.campo { display: flex; flex-direction: column; gap: 5px; }
label { font-size: 0.86rem; font-weight: 700; }
input, select {
  padding: 10px 13px; border-radius: 13px; border: 1px solid rgba(21,114,21,0.24);
  background: var(--input-bg); color: var(--texto); font-family: inherit; font-size: 0.94rem;
}
.check-fila { display: flex; align-items: center; gap: 8px; font-size: 0.9rem; font-weight: 600; }
.check-fila input { width: auto; }
.acciones { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 6px; }
pre {
  margin: 18px 0 0; padding: 14px; border-radius: 16px;
  background: rgba(10, 22, 9, 0.72); color: #dcfce7; font-size: 0.84rem; overflow-x: auto;
}
</style>
</head>
<body>
<div class="aero-bg" aria-hidden="true">
  <div class="orbe orbe-1"></div><div class="orbe orbe-2"></div><div class="orbe orbe-3"></div>
</div>

<div class="wrap">
  <header>
    <div>
      <h1>CONEXIÓN ESP32 &amp; API</h1>
      <p class="sub">Configura el endpoint JSON de tu ESP32 y prueba la comunicación en tiempo real.</p>
    </div>
    <a href="pagina principal.html" class="btn-volver">← Volver al monitoreo</a>
  </header>

  <section class="card">
    <form id="form-conexion">
      <div class="fila">
        <div class="campo">
          <label for="api-url">URL / Endpoint de la API (ESP32)</label>
          <input id="api-url" type="url" required placeholder="http://192.168.1.50/api/datos">
        </div>
        <div class="campo">
          <label for="api-intervalo">Intervalo de consulta</label>
          <select id="api-intervalo">
            <option value="2000">Cada 2 segundos</option>
            <option value="3000" selected>Cada 3 segundos</option>
            <option value="5000">Cada 5 segundos</option>
            <option value="10000">Cada 10 segundos</option>
          </select>
        </div>
      </div>

      <label class="check-fila">
        <input id="api-simular" type="checkbox">
        Usar datos simulados si no hay respuesta del ESP32
      </label>

      <div class="acciones">
        <button type="submit" class="btn-primario">Guardar configuración</button>
        <button type="button" class="btn-sec" id="btn-probar">Probar conexión ahora</button>
      </div>
    </form>

    <pre id="salida-api">// Aquí aparecerá la respuesta JSON de prueba o el estado de conexión...</pre>
  </section>
</div>

<script>
const STORAGE_KEY = "invernadero_sistema_v1";

function leerEstado() {
  const st = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}") || {};
  return {
    ...st,
    conexion: {
      url: "http://192.168.1.50/api/datos",
      intervaloMs: 3000,
      simular: true,
      ...(st.conexion || {})
    }
  };
}

const inicial = leerEstado();
document.getElementById("api-url").value = inicial.conexion.url;
document.getElementById("api-intervalo").value = String(inicial.conexion.intervaloMs);
document.getElementById("api-simular").checked = Boolean(inicial.conexion.simular);

document.getElementById("form-conexion").addEventListener("submit", (e) => {
  e.preventDefault();
  const st = leerEstado();
  st.conexion = {
    url: document.getElementById("api-url").value.trim(),
    intervaloMs: Number(document.getElementById("api-intervalo").value),
    simular: document.getElementById("api-simular").checked
  };
  localStorage.setItem(STORAGE_KEY, JSON.stringify(st));
  document.getElementById("salida-api").textContent =
    "Configuración guardada:\n" + JSON.stringify(st.conexion, null, 2);
});

document.getElementById("btn-probar").addEventListener("click", async () => {
  const url = document.getElementById("api-url").value.trim();
  const pre = document.getElementById("salida-api");
  pre.textContent = `Consultando ${url} ...`;

  try {
    const resp = await fetch(url, { signal: AbortSignal.timeout(3000) });
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
    const data = await resp.json();
    pre.textContent = "Conexión exitosa con el ESP32:\n" + JSON.stringify(data, null, 2);
  } catch (err) {
    pre.textContent =
      `No se pudo contactar ${url} (${err.message}).\n` +
      `Verifica que el ESP32 esté en la misma red Wi-Fi y envíe cabecera CORS:\n` +
      `Access-Control-Allow-Origin: *`;
  }
});
</script>
</body>
</html>
